name: Build Droidian Boot Image

on:
  workflow_dispatch:
  push:
    paths:
      - 'prebuilts/Image.gz'
      - '.github/workflows/droidian-boot.yml'

jobs:
  build-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decompress Kernel Image
        run: |
          set -euo pipefail
          echo "Распаковываем Image.gz..."
          gunzip -k prebuilts/Image.gz
          cp prebuilts/Image ./Image
          ls -lh ./Image

      - name: Download Official Halium GKI Ramdisk (Dynparts)
        run: |
          set -euo pipefail
          echo "Скачиваем официальный проверенный Halium ramdisk для GKI/Dynparts..."
          curl -sSL "https://github.com/halium/initramfs-tools-halium/releases/download/dynparts/initrd.img-touch-arm64" -o halium-initramfs.img
          ls -lh halium-initramfs.img

      - name: Pack boot-droidian.img (GKI Header v4)
        run: |
          set -euo pipefail
          wget -q https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-19.1/mkbootimg.py
          python3 mkbootimg.py \
            --header_version 4 \
            --kernel Image \
            --ramdisk halium-initramfs.img \
            --os_version 12.0.0 \
            --os_patch_level 2022-01 \
            --output boot-droidian.img
          ls -lh boot-droidian.img

      - name: Upload boot-droidian Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-droidian-image
          path: boot-droidian.img
          retention-days: 7
