name: Build Droidian Boot Image

on:
  workflow_dispatch:
  push:
    paths:
      - 'prebuilts/Image.gz'
      - '.github/workflows/droidian-boot.yml'

jobs:
  build-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decompress Kernel Image
        run: |
          set -euo pipefail
          echo "Распаковываем Image.gz..."
          gunzip -k prebuilts/Image.gz
          cp prebuilts/Image ./Image
          ls -lh ./Image

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Build ARM64 Halium Initramfs (Debian Bookworm)
        run: |
          docker run --platform linux/arm64 --rm -v "${{ github.workspace }}":/work -w /work debian:bookworm bash -c '
            set -euo pipefail
            apt-get update && apt-get install -y initramfs-tools busybox-static git cpio kmod dpkg-dev

            # 1. Заглушки хостового ядра
            HOST_KERNEL=$(uname -r)
            mkdir -p /boot /lib/modules/"$HOST_KERNEL"
            printf "CONFIG_RD_GZIP=y\nCONFIG_RD_ZSTD=y\n" > /boot/config-"$HOST_KERNEL"
            touch /lib/modules/"$HOST_KERNEL"/modules.dep
            touch /lib/modules/"$HOST_KERNEL"/modules.builtin
            touch /lib/modules/"$HOST_KERNEL"/modules.builtin.modinfo

            # 2. Автономный режим сборщика
            sed -i "s/^MODULES=.*/MODULES=list/" /etc/initramfs-tools/initramfs.conf
            sed -i "s/^COMPRESS=.*/COMPRESS=gzip/" /etc/initramfs-tools/initramfs.conf

            # 3. Клонируем и ставим хуки Halium
            git clone https://github.com/droidian/initramfs-tools-halium.git /tmp/halium
            cp -r /tmp/halium/hooks/* /etc/initramfs-tools/hooks/
            cp -r /tmp/halium/scripts/* /etc/initramfs-tools/scripts/

            # 4. Собираем ramdisk
            mkinitramfs -o /work/halium-initramfs.img "$HOST_KERNEL"
          '
          ls -lh halium-initramfs.img

      - name: Pack boot-droidian.img (GKI Header v4)
        run: |
          wget -q https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-19.1/mkbootimg.py
          python3 mkbootimg.py \
            --header_version 4 \
            --kernel Image \
            --ramdisk halium-initramfs.img \
            --os_version 12.0.0 \
            --os_patch_level 2022-01 \
            --output boot-droidian.img
          ls -lh boot-droidian.img

      - name: Upload boot-droidian Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-droidian-image
          path: boot-droidian.img
          retention-days: 7
