name: Set Kernel Config
description: Patch gki_defconfig directly (add or modify entries)

inputs:
  config_list:
    required: true
    description: "Kernel config lines"

runs:
  using: composite
  steps:
  - name: Patch gki_defconfig
    shell: bash
    working-directory: ${{ github.workspace }}/kernel/common
    run: |
      set -euo pipefail

      DEFCONFIG="arch/arm64/configs/gki_defconfig"
      CONFIG_LIST="${{ inputs.config_list }}
      CONFIG_FHANDLE=y
      CONFIG_AUTOFS_FS=y
      CONFIG_FANOTIFY=y
      CONFIG_DEVTMPFS_MOUNT=y
      CONFIG_VT=y
      CONFIG_DUMMY_CONSOLE=y
      CONFIG_VT_CONSOLE=y
      CONFIG_CGROUP_DEVICE=y
      CONFIG_SQUASHFS=y
      CONFIG_SQUASHFS_XZ=y
      CONFIG_SQUASHFS_ZLIB=y
      CONFIG_MACVLAN=y
      CONFIG_BRIDGE_NETFILTER=y
      CONFIG_VETH=y
      CONFIG_SECURITY_APPARMOR=y
      CONFIG_DEFAULT_SECURITY_APPARMOR=y
      CONFIG_BT_HCIBTSDIO=y
      CONFIG_BT_HCIUART=y
      CONFIG_IP_SET=y"

      if [ ! -f "$DEFCONFIG" ]; then
        echo "ERROR: gki_defconfig not found"
        exit 1
      fi

      apply_line() {
        local line="$1"
        line="$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

        # skip empty/comments
        [[ -z "$line" || "$line" == \#* ]] && return

        local key value
        if [[ "$line" == *"="* ]]; then
          key="${line%%=*}"
          value="${line#*=}"
        else
          key="$line"
          value="y"
        fi

        echo "Processing: $key=$value"

        # if config exists anywhere in file → replace it
        if grep -q "^$key=" "$DEFCONFIG"; then
          sed -i "s|^$key=.*|$key=$value|g" "$DEFCONFIG"
        elif grep -q "^# $key is not set" "$DEFCONFIG"; then
          sed -i "s|^# $key is not set|$key=$value|g" "$DEFCONFIG"
        else
          # not present → append
          echo "$key=$value" >> "$DEFCONFIG"
        fi
      }

      while IFS= read -r line || [ -n "$line" ]; do
        apply_line "$line"
      done <<< "$CONFIG_LIST"

      echo "Patching fanotify_fdinfo for Android GKI..."
      if [ -f "fs/notify/fdinfo.c" ]; then
        sed -i 's/fanotify_fdinfo(struct seq_file \*m, struct fsnotify_mark \*mark)/fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark, struct file *f)/g' fs/notify/fdinfo.c
      fi
